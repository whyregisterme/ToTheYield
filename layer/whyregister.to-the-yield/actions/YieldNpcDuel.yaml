# A duelist in an NPC duel offers their yield: TTY_NpcDuel.YieldNpcDuel on quest TTY_NpcDuelQuest.
# The other duelist answers it (AcceptNpcYield, RefuseNpcYield, DeathNpcDuel).
name: YieldNpcDuel
description: >-
  Offer your yield in the duel you are fighting: lower your weapon and offer to end the fight. Your opponent decides whether to accept it.

questEditorId: TTY_NpcDuelQuest
scriptName: TTY_NpcDuel
executionFunctionName: YieldNpcDuel

# Function YieldNpcDuel(Actor akSpeaker)
parameterMapping:
  - type: speaker

eligibilityRules:
  - conditions:
      # TTY_NpcDuelist is 1 on an NPC only while they are fighting an NPC duel.
      - decoratorName: papyrus_util
        arguments: ["GetIntValue", "currentActor", "TTY_NpcDuelist", 0]
        comparisonOperator: "=="
        expectedValue: 1
    logicalOperator: AND
    required: true

eventString: "{{ actor_name }} offered a yield."
defaultPriority: 6
