# The duelist a yield was offered to accepts it: the duel is over and they have won.
name: AcceptNpcYield
description: >-
  Accept the yield your opponent just offered: the duel is over and you have won it.

questEditorId: TTY_NpcDuelQuest
scriptName: TTY_NpcDuel
executionFunctionName: AcceptNpcYield

# Function AcceptNpcYield(Actor akSpeaker)
parameterMapping:
  - type: speaker

eligibilityRules:
  - conditions:
      # TTY_NpcYieldOffer is 1 on a duelist only while a yield offered to them waits on their answer.
      - decoratorName: papyrus_util
        arguments: ["GetIntValue", "currentActor", "TTY_NpcYieldOffer", 0]
        comparisonOperator: "=="
        expectedValue: 1
    logicalOperator: AND
    required: true

eventString: "{{ actor_name }} accepted the yield."
defaultPriority: 7
