# Starts a duel between the speaker and the player: TTY_Main.BeginDuel on quest TTY_Quest.
# The player confirms in a message box before anything happens, so a misfire costs one click.
name: BeginDuel
description: >-
  Begin a formal duel with {{ player.name }}: real weapons, fought until one of you yields or goes
  down, and nobody dies. Use it ONLY when a duel has just been agreed between you and
  {{ player.name }}: they challenged you and you accept, or you challenged them and they said yes.
  Never use it for an ordinary fight, an ambush, or before {{ player.name }} has agreed.

questEditorId: TTY_Quest
scriptName: TTY_Main
executionFunctionName: BeginDuel

# Function BeginDuel(Actor akSpeaker)
parameterMapping:
  - type: speaker

# Distance, mounts, children, hostility and followers are also checked in Papyrus (CannotDuelReason).
eligibilityRules:
  - conditions:
      - decoratorName: is_in_combat
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
      # Current followers won't fight the player (tested); TTY_Main refuses them too, with a hint.
      # Rank, not is_in_faction: a dismissed follower keeps the faction at rank -1, which
      # is_in_faction still counts (0.2.2 blocked dismissed followers that way). get_faction_rank
      # gives -1 for both "dismissed" and "never a follower"; current followers are 0 or more.
      - decoratorName: get_faction_rank
        arguments: ["currentActor", "CurrentFollowerFaction"]
        comparisonOperator: "<"
        expectedValue: 0
      # TTY_Active is set by TTY_Main while a duel is being fought.
      - decoratorName: papyrus_util
        arguments: ["GetIntValue", "none", "TTY_Active", 0]
        comparisonOperator: "=="
        expectedValue: 0
    logicalOperator: AND
    required: true

eventString: "{{ actor_name }} agreed to a duel with {{ player.name }}."
defaultPriority: 5
