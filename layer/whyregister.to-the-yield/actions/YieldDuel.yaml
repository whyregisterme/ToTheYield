# Lets the opponent concede in the middle of a duel: TTY_Main.YieldDuel on quest TTY_Quest.
name: YieldDuel
description: >-
  Concede the duel you are fighting with {{ player.name }}: lower your weapon and admit defeat.
  Use it when you are badly hurt, clearly outmatched, or have seen enough to respect
  {{ player.name }}.

questEditorId: TTY_Quest
scriptName: TTY_Main
executionFunctionName: YieldDuel

# Function YieldDuel(Actor akSpeaker)
parameterMapping:
  - type: speaker

eligibilityRules:
  - conditions:
      # TTY_Opponent is 1 on the NPC only while they are fighting a duel with the player.
      - decoratorName: papyrus_util
        arguments: ["GetIntValue", "currentActor", "TTY_Opponent", 0]
        comparisonOperator: "=="
        expectedValue: 1
    logicalOperator: AND
    required: true

eventString: "{{ actor_name }} conceded the duel to {{ player.name }}."
defaultPriority: 6
