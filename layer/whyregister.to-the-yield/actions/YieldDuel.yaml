# Lets the opponent concede in the middle of a duel: TTY_Main.YieldDuel on quest TTY_Quest.
name: YieldDuel
description: >-
  Offer {{ player.name }} your yield in the duel you are fighting: lower your weapon and offer to
  end the fight. {{ player.name }} decides whether to accept it.

questEditorId: TTY_Quest
scriptName: TTY_Main
executionFunctionName: YieldDuel

# Function YieldDuel(Actor akSpeaker)
parameterMapping:
  - type: speaker

eligibilityRules:
  - conditions:
      # TTY_Opponent is 1 on the NPC only while they are fighting a duel with the player.
      - decoratorName: papyrus_util
        arguments: ["GetIntValue", "currentActor", "TTY_Opponent", 0]
        comparisonOperator: "=="
        expectedValue: 1
    logicalOperator: AND
    required: true

eventString: "{{ actor_name }} offered {{ player.name }} a yield."
defaultPriority: 6
